---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: envoy-python-server
  namespace: test-1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: test-1
data:
  envoy.yaml: |
    node:
      id: "python-reverse-proxy"
      cluster: "envoy-cluster-with-spire"
    admin:
      access_log_path: /tmp/admin_access.log
      address:
        socket_address:
          protocol: TCP
          address: 0.0.0.0
          port_value: 9901
    static_resources:
      listeners:
        - name: ingress_python_mtls
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 8080
          filter_chains:
            - filters:
                - name: envoy.filters.network.tcp_proxy
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                    stat_prefix: python_server_tcp
                    cluster: python_service
              transport_socket:
                name: envoy.transport_sockets.tls
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
                  require_client_certificate: true
                  common_tls_context:
                    alpn_protocols:
                      - istio-peer-exchange
                      - istio
                    combined_validation_context:
                      default_validation_context:
                        match_subject_alt_names:
                          - exact: spiffe://cluster-a/ns/openshift-cloud-controller-manager/sa/cloud-controller-manager
                          - exact: spiffe://cluster-b/ns/openshift-cloud-controller-manager/sa/cloud-controller-manager
                      validation_context_sds_secret_config:
                        name: "ALL"
                        sds_config:
                          api_config_source:
                            api_type: GRPC
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: sds-grpc
                            set_node_on_first_message_only: true
                            transport_api_version: V3
                          initial_fetch_timeout: 0s
                          resource_api_version: V3
                    tls_certificate_sds_secret_configs:
                      - name: default
                        sds_config:
                          api_config_source:
                            api_type: GRPC
                            grpc_services:
                              - envoy_grpc:
                                  cluster_name: sds-grpc
                            set_node_on_first_message_only: true
                            transport_api_version: V3
                          initial_fetch_timeout: 0s
                          resource_api_version: V3
                    tls_params:
                      tls_maximum_protocol_version: TLSv1_3
                      tls_minimum_protocol_version: TLSv1_2
      clusters:
        - name: sds-grpc
          type: STATIC
          connect_timeout: 1s
          http2_protocol_options: {}
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: sds-grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        pipe:
                          path: /tmp/spire-agent/spire-agent.sock
        - name: python_service
          connect_timeout: 1s
          type: STATIC
          load_assignment:
            cluster_name: python_service
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-python-server
  namespace: test-1
  labels:
    app: envoy-python-server
spec:
  ports:
    - port: 8080
      name: envoy
    - port: 8000
      name: python-server
    - port: 9901
      name: admin
  selector:
    app: envoy-python-server
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-python-server
  namespace: test-1
  labels:
    app: envoy-python-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-python-server
  template:
    metadata:
      labels:
        app: envoy-python-server
    spec:
      serviceAccountName: envoy-python-server
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.28-latest
        ports:
        - containerPort: 8080
          name: python-proxy
          protocol: TCP
        - containerPort: 9901
          name: admin
          protocol: TCP
        volumeMounts:
        - name: envoy-config
          mountPath: /etc/envoy
          readOnly: true
        - name: spire-agent-socket
          mountPath: /tmp/spire-agent
          readOnly: true
        command:
        - /usr/local/bin/envoy
        args:
        - -c
        - /etc/envoy/envoy.yaml
        - --log-level
        - info
      - name: python-server
        image: python:3.11-slim
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        command:
        - python
        - -m
        - http.server
        - "8000"
        workingDir: /app
      volumes:
      - name: envoy-config
        configMap:
          name: envoy-config
      - name: spire-agent-socket
        csi:
          driver: "csi.spiffe.io"
          readOnly: true
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: python-server
spec:
  className: zero-trust-workload-identity-manager-spire
  fallback: true
  federatesWith:
    - cluster-b
  hint: default
  podSelector:
    matchLabels:
      app: "envoy-python-server"
  spiffeIDTemplate: spiffe://{{ .TrustDomain }}/ns/{{ .PodMeta.Namespace }}/sa/{{.PodSpec.ServiceAccountName }}
